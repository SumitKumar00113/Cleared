services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set test http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing test/cleared-private"]

  clamav:
    image: clamav/clamav:1.4.2
    ports:
      - "3310:3310"
    volumes:
      - ./infra/clamd.integration.conf:/etc/clamav/clamd.conf:ro
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1", "--config-file=/etc/clamav/clamd.conf"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 90s

volumes:
  minio-data:
  clamav-data:
