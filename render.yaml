services:
  - type: web
    name: cleared-api
    runtime: node
    plan: starter
    numInstances: 1
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start --workspace @cleared/api
    healthCheckPath: /api/health
    disk:
      name: cleared-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CLEARED_DB_PATH
        value: /var/data/cleared.sqlite
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: FILE_STORAGE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_SESSION_TOKEN
        sync: false
      - key: FILE_SCANNER
        value: clamav
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: 3310

